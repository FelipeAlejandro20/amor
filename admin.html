<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitas — Panel</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      padding: 40px 20px 80px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .admin-login,
    .admin-panel {
      max-width: 420px;
      margin: 80px auto;
      background: rgba(45, 10, 30, 0.85);
      border: 1px solid rgba(244, 143, 177, 0.25);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .admin-panel {
      max-width: 100%;
      margin: 40px auto;
    }

    .admin-login h1,
    .admin-panel h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: #fff0f5;
    }

    .admin-login input {
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(244, 143, 177, 0.3);
      background: rgba(255, 255, 255, 0.08);
      color: #fff0f5;
      font-family: 'Nunito', sans-serif;
      margin-bottom: 1rem;
    }

    .admin-login button,
    .admin-panel button {
      background: linear-gradient(135deg, #e91e63, #ad1457);
      color: white;
      border: none;
      padding: 0.8rem 1.4rem;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
    }

    .admin-stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .admin-stat {
      background: rgba(233, 30, 99, 0.12);
      border: 1px solid rgba(244, 143, 177, 0.2);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      min-width: 140px;
    }

    .admin-stat strong {
      display: block;
      font-size: 1.6rem;
      color: #f48fb1;
    }

    .admin-tabla-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid rgba(244, 143, 177, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(244, 143, 177, 0.12);
      color: rgba(255, 240, 245, 0.9);
      vertical-align: top;
    }

    th {
      background: rgba(233, 30, 99, 0.15);
      color: #f48fb1;
      font-weight: 600;
      white-space: nowrap;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .admin-aviso {
      background: rgba(233, 30, 99, 0.12);
      border: 1px solid rgba(244, 143, 177, 0.25);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      color: rgba(255, 240, 245, 0.85);
      line-height: 1.6;
    }

    .admin-error {
      color: #ff8a9b;
      margin-top: 0.8rem;
      font-size: 0.9rem;
    }

    .admin-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div id="login" class="admin-login">
    <h1>Panel de visitas</h1>
    <p style="color: rgba(255,240,245,0.7); margin-bottom: 1rem;">Ingresa la clave para ver el historial.</p>
    <input type="password" id="claveInput" placeholder="Clave de acceso">
    <button id="btnLogin">Entrar</button>
    <p id="loginError" class="admin-error"></p>
  </div>

  <div id="panel" class="admin-panel" style="display: none;">
    <div class="admin-toolbar">
      <h1>Historial de visitas</h1>
      <button id="btnRefrescar">Actualizar</button>
    </div>

    <div id="avisoConfig" class="admin-aviso" style="display: none;"></div>

    <div class="admin-stats">
      <div class="admin-stat">
        <strong id="totalVisitas">0</strong>
        <span>Total de visitas</span>
      </div>
      <div class="admin-stat">
        <strong id="ultimaVisita">—</strong>
        <span>Última visita</span>
      </div>
    </div>

    <div class="admin-tabla-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Fecha y hora</th>
            <th>Navegador</th>
            <th>Sistema</th>
            <th>Dispositivo</th>
            <th>Idioma</th>
            <th>Pantalla</th>
          </tr>
        </thead>
        <tbody id="tablaVisitas"></tbody>
      </table>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
